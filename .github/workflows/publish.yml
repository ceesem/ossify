name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies for PyVista/VTK rendering
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglx-mesa0 libxrender1 libxkbcommon0 libdbus-1-3 \
            libegl1 libosmesa6 xvfb
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.13"
      - name: Check release tag matches package version
        run: |
          version=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} does not match pyproject version ${version}"
            exit 1
          fi
      - name: Run tests
        run: uv run --locked pytest tests
      - name: Build
        run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ossify
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
