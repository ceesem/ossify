[build-system]
requires = ["hatchling>=1.26.1"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true
[project]
name = "ossify"
version = "0.2.1"
description = "Mesh and skeleton analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "caveclient>=8.2.1",
    "numpy>=2.0.2",
    "scipy>=1.15",
    "trimesh>=4.6.2",
    "orjson>=3.10.15",
    "cloud-files>=5.8.0",
    "matplotlib>=3.10.6",
    "fastremap>=1.15.1",
]
authors = [
    { name = "Casey Schneider-Mizell", email = "caseysm@gmail.com" },
]

classifiers = [
    "License :: OSI Approved :: MIT License",
]

[project.optional-dependencies]
legacy = [
    "h5py>=3.14.0",
]
compartments = [
    "xgboost>=2.0",
    "scikit-learn>=1.3",
]
viz = [
    "pyvista[jupyter]>=0.46",
    "trame>=3.10",
    "imageio>=2.34",
]

[tool.hatch.build.targets.wheel]
artifacts = [
    "src/ossify/compartment_models/**/*.json",
    "src/ossify/compartment_models/**/*.ubj",
]

[tool.hatch.build.targets.sdist]
exclude = [
    "tests/",
    "docs/",
    "*.osy",
    "*.h5",
    "uv.lock",
    ".claude/",
    ".bmv-post-commit.sh",
    "CLAUDE.md",
    "DOC_PLAN.md",
    "PROJECT_SUMMARY.md",
    "rotation_plan.md",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ipykernel",
    "bump-my-version",
    "cloud-volume",
    "h5py>=3.14.0",
]
docs = [
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]",
]
lint = [
    "ruff"
]
profile = [
    "scalene",
    "pyinstrument",
]
viz = [
    "imageio",
    "pyvista",
]


[tool.uv]
default-groups = ["dev", "docs", "lint", "profile", "viz"]


[tool.bumpversion]
current_version = "0.2.1"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
regex = false
ignore_missing_version = false
tag = true
sign_tags = false
tag_name = "v{new_version}"
tag_message = "Bump version: {current_version} → {new_version}"
allow_dirty = false
commit = true
message = "v{new_version}"
commit_args = ""
pre_commit_hooks = ['uv sync', 'git add uv.lock']
post_commit_hooks = ["./.bmv-post-commit.sh"]

[[tool.bumpversion.files]]
filename = "src/ossify/__init__.py"
search = "__version__ = \"{current_version}\""
replace = "__version__ = \"{new_version}\""

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = "version = \"{current_version}\""
replace = "version = \"{new_version}\""

[tool.ruff]
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select=["E9","F63","F7","F82"]

[tool.poe.tasks.drybump]
cmd = "uv run bump-my-version bump --dry-run --verbose"
help = "Dry run of version bump for the project. Use with 'patch', 'minor', or 'major' to specify the version change."

[tool.poe.tasks.bump]
cmd = "uv run bump-my-version bump"
help = "Bump the version number in the project. Use with 'patch', 'minor', or 'major' to specify the version change."

[tool.poe.tasks.test]
cmd = "uv run pytest --cov=ossify --cov-branch --cov-report=term-missing tests"
help = "Run pytest with branch coverage and a missing-lines report."

[tool.pytest.ini_options]
# src-layout: put the package on the path so tests import ossify from src/
# during collection without relying on the editable install being present.
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["ossify"]

[tool.coverage.report]
# Surface partially-covered branches, not just uncovered lines.
show_missing = true
skip_covered = false

[tool.poe.tasks.doc-preview]
cmd = "uv run mkdocs serve"
help = "Preview documentation build locally"

[tool.poe.tasks.profile-all]
cmd = "uv run scalene"
help = "Profile cpu and memory of task with scalene"

[tool.poe.tasks.profile]
cmd = "uv run pyinstrument -r html"
help = "Profile cpu of task with pyinstrument"
